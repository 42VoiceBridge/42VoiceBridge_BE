name: Backend CI and image

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/42voicebridge/42voicebridge_be
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Prepare image context
        shell: bash
        run: |
          set -euo pipefail
          jar_count=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | wc -l)
          if [ "$jar_count" -ne 1 ]; then
            echo "Expected exactly one executable JAR, found $jar_count" >&2
            exit 1
          fi
          jar_path=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          mkdir -p build/image-context
          cp "$jar_path" build/image-context/app.jar
          cp Dockerfile build/image-context/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: build/image-context
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record deployable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Deployable backend image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
