spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voicebridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 로컬 개발 편의용. 운영은 Flyway(db/migration)로 스키마를 만들고 validate로 확인한다.
      ddl-auto: update

voicebridge:
  storage:
    # 로컬 전용. LocalFileStorageAdapter가 여기에 음성 파일을 저장한다.
    local-dir: ./uploads

logging:
  level:
    org.hibernate.SQL: debug
