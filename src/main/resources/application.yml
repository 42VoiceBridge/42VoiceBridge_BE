spring:
  application:
    name: voicebridge-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # 기본값 1MB는 녹음 파일에 부족하다. 동시에 과도한 업로드를 막는 상한 역할도 한다.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

voicebridge:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32chars-min}
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 1209600
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
  ai:
    http:
      base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
  s3:
    bucket: ${S3_BUCKET:voicebridge-recordings}
    region: ${AWS_REGION:ap-northeast-2}
  tts:
    naver:
      base-url: https://naveropenapi.apigw.ntruss.com/tts-premium/v1/tts
      api-key-id: ${NCP_TTS_API_KEY_ID:}
      api-key: ${NCP_TTS_API_KEY:}
      speaker: nara
