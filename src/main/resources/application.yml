spring:
  application:
    name: voicebridge-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

voicebridge:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32chars-min}
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 1209600
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
  ai:
    jpyrust:
      instance-id: voicebridge
      # PoC에서 검증한 값. 인식 정확도 검증(AI팀)이 끝나면 base/small 등으로 교체될 수 있다.
      whisper-model-path: tiny
