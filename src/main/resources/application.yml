spring:
  application:
    name: voicebridge-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
  task:
    execution:
      # 진단 인식 전용 실행기(AsyncConfig)를 따로 등록해도 스프링 부트 기본 실행기를 그대로 만든다. 없으면 TTS 같은 다른 @Async까지 진단 실행기로 몰린다.
      mode: force
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # 기본값 1MB는 녹음 파일에 부족하다. 동시에 과도한 업로드를 막는 상한 역할도 한다.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

voicebridge:
  personalization:
    # createdAt 기준. 변경한 기간은 기존 녹음에도 적용된다. 팀·AI의 보관 기간 합의는 별도 확인이 필요하다.
    retention-days: ${PERSONALIZATION_RETENTION_DAYS:30}
    cleanup-delay-ms: ${PERSONALIZATION_CLEANUP_DELAY_MS:300000}
    # 실패 업로드 정리와 만료 삭제를 함께 제어한다.
    scheduling-enabled: ${PERSONALIZATION_SCHEDULING_ENABLED:true}
  audio:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
    timeout: 20s
    queue-timeout: 2s
    max-concurrent: 2
    max-source-bytes: 10485760
    downmix-stereo: true
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32chars-min}
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 1209600
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
  ai:
    http:
      base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
    jamo-stats:
      # 자모 하나의 오류율을 보여주려면 최소 이만큼 표본이 필요하다. AI 기본값은 20이지만 세션 2~3개로는 거의 아무것도 안 보여서
      # 진단 화면용으로 10을 쓴다(2026-09-29 결정, 근거는 PROGRESS 23번). 바꾸면 기존 스냅샷은 다음 조회 때 새 기준으로 다시 계산된다.
      min-support: 10
  diagnosis:
    recognition:
      # 진단 녹음 인식 전용 스레드 수와 대기열. AI 서버가 요청을 하나씩 처리하므로 스레드를 늘려도 빨라지지 않는다.
      threads: 2
      queue-capacity: 200
  s3:
    bucket: ${S3_BUCKET:voicebridge-recordings}
    region: ${AWS_REGION:ap-northeast-2}
  tts:
    naver:
      base-url: https://naveropenapi.apigw.ntruss.com/tts-premium/v1/tts
      api-key-id: ${NCP_TTS_API_KEY_ID:}
      api-key: ${NCP_TTS_API_KEY:}
      speaker: nara
